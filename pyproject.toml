[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexpro-bridge"
version = "0.1.0"
description = "A companion MCP that exposes live Hermes Skills, MCP tools, and conditional Memos recall"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "CodexPro Bridge contributors" }]
keywords = ["codexpro", "hermes-agent", "mcp", "chatgpt", "skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp==1.26.0",
  "PyYAML==6.0.3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.urls]
Homepage = "https://github.com/bsbofmusic/codexpro-bridge"
Repository = "https://github.com/bsbofmusic/codexpro-bridge.git"
Issues = "https://github.com/bsbofmusic/codexpro-bridge/issues"

[project.scripts]
codexpro-bridge = "codexpro_bridge.server.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
